<link rel="stylesheet" href="{{ '/assets/css/custom.css' | relative_url }}">
<link rel="icon" href="{{ '/assets/img/favicon.ico' | relative_url }}" sizes="any">

<!-- Sprite SVG de la tortuga (se define una sola vez y se reutiliza en la mascota flotante y en el footer) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="tortuga-svg" viewBox="0 0 100 60">
    <!-- patas traseras -->
    <ellipse class="leg-bl" cx="24" cy="47" rx="8" ry="5" fill="#0a7a0c"/>
    <ellipse class="leg-br" cx="24" cy="47" rx="8" ry="5" fill="#08650a" opacity="0.9"/>
    <!-- patas delanteras -->
    <ellipse class="leg-fl" cx="72" cy="47" rx="8" ry="5" fill="#0a7a0c"/>
    <ellipse class="leg-fr" cx="72" cy="47" rx="8" ry="5" fill="#08650a" opacity="0.9"/>
    <!-- cola -->
    <path d="M14 34 Q4 36 8 42 Q12 40 16 36 Z" fill="#0a7a0c"/>
    <!-- cuerpo / caparazón -->
    <ellipse cx="50" cy="30" rx="38" ry="22" fill="#066007"/>
    <ellipse cx="50" cy="30" rx="38" ry="22" fill="none" stroke="#04440a" stroke-width="1.5" opacity="0.5"/>
    <!-- hexágonos del caparazón -->
    <g fill="none" stroke="#0d8a12" stroke-width="1.6" opacity="0.85">
      <polygon points="50,15 58,20 58,29 50,34 42,29 42,20"/>
      <polygon points="30,22 37,26 37,34 30,38 23,34 23,26"/>
      <polygon points="70,22 77,26 77,34 70,38 63,34 63,26"/>
      <polygon points="40,36 47,40 47,47 40,50 33,47 33,40"/>
      <polygon points="60,36 67,40 67,47 60,50 53,47 53,40"/>
    </g>
    <!-- cabeza -->
    <ellipse cx="90" cy="27" rx="11" ry="9" fill="#0a7a0c"/>
    <circle cx="94" cy="24" r="1.6" fill="#08240a"/>
  </symbol>
</svg>

<!-- Mascota flotante: tortuga que "respira"/camina suavemente en la esquina -->
<div class="turtle-mascot" aria-hidden="true">
  <svg viewBox="0 0 100 60"><use href="#tortuga-svg"/></svg>
</div>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const titleLink = document.querySelector('.site-title');
    if (!titleLink || titleLink.querySelector('img')) return;
    const img = document.createElement('img');
    img.src = "{{ '/assets/img/logotipo.png' | relative_url }}";
    img.alt = "Logo";
    img.className = "site-logo";
    titleLink.prepend(img);
  });
</script>
